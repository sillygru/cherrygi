name: Build & Release CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux (Qt6 & KF6)
    runs-on: ubuntu-latest
    container:
      image: fedora:40

    steps:
      - name: Install system dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc-c++ \
            cmake \
            ninja-build \
            extra-cmake-modules \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel \
            kf6-kirigami-devel \
            kf6-kcoreaddons-devel \
            kf6-ki18n-devel \
            kf6-kiconthemes-devel \
            kf6-kcolorscheme-devel \
            kf6-kconfig-devel \
            zlib-devel \
            git \
            gh

      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure CMake
        env:
          TELEMETRY_SECRET: ${{ secrets.TELEMETRY_SECRET }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTELEMETRY_SECRET="${TELEMETRY_SECRET}"

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Package Binary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          strip build/cherrygi
          tar -czvf dist/cherrygi-linux-x86_64.tar.gz -C build cherrygi

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW_VERSION=$(sed -n 's/.*project(cherrygi VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt | tr -d '[:space:]')
          VERSION="v${RAW_VERSION}"
          
          echo "Target Release Version: $VERSION"

          # Skip if release already exists
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists. Skipping."
            exit 0
          fi

          COMMIT_TITLE=$(git log -1 --format=%s)
          COMMIT_BODY=$(git log -1 --format=%b)

          if [ -z "$COMMIT_BODY" ]; then
            NOTES="$COMMIT_TITLE"
          else
            NOTES="$COMMIT_BODY"
          fi

          echo "Creating Release $VERSION with title: '$COMMIT_TITLE'"
          gh release create "$VERSION" dist/cherrygi-linux-x86_64.tar.gz \
            --title "$COMMIT_TITLE" \
            --notes "$NOTES"
